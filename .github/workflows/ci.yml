# CI, layout after hugr-lab/duckdb-acl: lint + a Linux build-and-test on every PR, a representative
# macOS build on merges to main and manual runs. Full platform coverage lives in distribution.yml.
#
# The whole stack is release-pinned (see CLAUDE.md): duckdb v1.5.5, ducklake v1.5-variegata,
# mssql v0.2.4, extension-ci-tools v1.5.5. A red build means our code or a pin bump - never a
# floating upstream.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (clang-format)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # the project standard is duckdb's pinned formatter (scripts/format.py: clang_format==11.0.1),
      # called by full path so no runner binary can shadow it. NB `.clang-format` must be a real
      # file: the template ships it as a symlink into the duckdb submodule, and this job checks out
      # no submodules - a dangling config makes clang-format silently fall back to LLVM defaults
      - name: Install duckdb's pinned clang-format
        run: |
          python3 -m venv /tmp/cf
          /tmp/cf/bin/pip install clang_format==11.0.1
          /tmp/cf/bin/clang-format --version
      - name: clang-format check
        run: |
          find src \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 /tmp/cf/bin/clang-format --dry-run --Werror
      - name: yamllint
        run: |
          pip install yamllint
          yamllint .github/workflows

  build-test-linux:
    name: Build + test (linux_amd64)
    runs-on: ubuntu-24.04
    services:
      # the DuckLake catalog server behind test/sql/integration (docker/docker-compose.yml is the
      # local twin); it starts bare, the seed step below creates lake_meta with the same script
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2025-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: TestPassword1
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P TestPassword1 -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
    env:
      GEN: ninja
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/vcpkg_bincache,readwrite'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache

      # the lint job checks format against the repo's own .clang-format copy; this job has the
      # submodules, so it is the one that can tell when that copy drifts from duckdb's
      - name: clang-format config is in sync with duckdb
        run: diff <(tail -n +2 .clang-format) duckdb/.clang-format

      # dependencies (roaring from ducklake, openssl/simdutf from mssql) come from vcpkg via the
      # merged manifests of the loaded extensions - the standard duckdb-extension dependency flow
      - name: Setup vcpkg
        run: make vcpkg-setup

      - name: Cache vcpkg binary packages
        uses: actions/cache@v6
        with:
          path: vcpkg_bincache
          key: vcpkg-bincache-linux_amd64-${{ hashFiles('.gitmodules', 'extension_config.cmake') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-bincache-linux_amd64-${{ hashFiles('.gitmodules', 'extension_config.cmake') }}-
            vcpkg-bincache-linux_amd64-

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-linux_amd64-${{ hashFiles('.gitmodules') }}-${{ github.sha }}
          restore-keys: |
            ccache-linux_amd64-${{ hashFiles('.gitmodules') }}-
            ccache-linux_amd64-

      - name: Build
        run: |
          EXT_FLAGS="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache" make
          ccache -s

      # the artifact must LOAD, not only compile: copied out of the tree and loaded from another
      # directory, as an operator would - both with its deps and without them (the gate's message)
      - name: The artifact loads
        run: scripts/ci/smoke_load.sh

      # vcpkg's cache only grows; drop two-week-old archives before actions/cache saves it
      - name: Prune the vcpkg binary cache
        if: always()
        run: scripts/ci/prune_vcpkg_cache.sh

      # the image ships sqlcmd (the health check above is that binary), so seed from inside the
      # container rather than installing mssql-tools on the runner (mssql-extension #199)
      - name: Seed the catalog database
        env:
          SQLSERVER_ID: ${{ job.services.sqlserver.id }}
        run: |
          docker cp docker/init/sqlserver.sql "$SQLSERVER_ID:/tmp/sqlserver.sql"
          docker exec "$SQLSERVER_ID" /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P TestPassword1 -C -b -i /tmp/sqlserver.sql

      # the floor keeps a suite that silently skipped everything (a `require` miss) from passing;
      # this runner has the SQL Server, so the integration file must have run, not skipped
      - name: Unit + integration suites
        env:
          MSSQL_DUCKLAKE_TEST_DSN: Server=localhost,1433;Database=lake_meta;User Id=sa;Password=TestPassword1
        run: |
          build/release/test/unittest 'test/sql/*' 2>&1 | tee suite.log
          scripts/ci/assert_ran.sh suite.log 3 30 'require-env MSSQL_DUCKLAKE_TEST_DSN'

      - name: Upload extension artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: mssql_ducklake-linux_amd64
          path: build/release/extension/mssql_ducklake/mssql_ducklake.duckdb_extension

  # Representative second platform; PRs stay on the Linux job to keep them fast
  build-test-osx:
    name: Build + test (osx_arm64)
    runs-on: macos-14
    if: ${{ github.event_name != 'pull_request' }}
    env:
      GEN: ninja
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/vcpkg_bincache,readwrite'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: brew install ninja ccache

      - name: Setup vcpkg
        run: make vcpkg-setup

      - name: Cache vcpkg binary packages
        uses: actions/cache@v6
        with:
          path: vcpkg_bincache
          key: vcpkg-bincache-osx_arm64-${{ hashFiles('.gitmodules', 'extension_config.cmake') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-bincache-osx_arm64-${{ hashFiles('.gitmodules', 'extension_config.cmake') }}-
            vcpkg-bincache-osx_arm64-

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-osx_arm64-${{ hashFiles('.gitmodules') }}-${{ github.sha }}
          restore-keys: |
            ccache-osx_arm64-${{ hashFiles('.gitmodules') }}-
            ccache-osx_arm64-

      - name: Build
        run: |
          EXT_FLAGS="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache" make
          ccache -s

      - name: The artifact loads
        run: scripts/ci/smoke_load.sh

      - name: Prune the vcpkg binary cache
        if: always()
        run: scripts/ci/prune_vcpkg_cache.sh

      # no docker on the macOS runner: the integration file skips here (its require-env), the Linux
      # job is the one that must run it
      - name: Unit suites
        run: |
          build/release/test/unittest 'test/sql/*' 2>&1 | tee suite.log
          scripts/ci/assert_ran.sh suite.log 2 6

      - name: Upload extension artifact
        uses: actions/upload-artifact@v7
        with:
          name: mssql_ducklake-osx_arm64
          path: build/release/extension/mssql_ducklake/mssql_ducklake.duckdb_extension
