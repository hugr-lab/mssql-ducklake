# The integration environment: one SQL Server that holds the DuckLake catalog (the metadata side
# of `ATTACH 'ducklake:mssql:...'`). Layout after hugr-lab/duckdb-acl and mssql-extension.
#
# Usage (from the repo root):
#   cp .env.example .env         # once; adjust if the port or password clash with something local
#   make docker-up               # start, wait for healthy, run the init container (creates lake_meta)
#   make docker-status
#   make docker-down             # stop (keeps the data volume); `docker compose ... down -v` drops it
#
# Every name is explicit and prefixed `mssql-ducklake-`: this machine also runs the SQL Servers of
# mssql-extension (mssql-dev, :1433), duckdb-acl (acl-sqlserver, :6434) and hugr (hugr-mssql,
# :18033), and compose would otherwise derive `docker_*` names from this directory - the same
# names those repos' `docker/` folders derive, so it would recreate THEIR containers as ours.
name: mssql-ducklake

services:
  sqlserver:
    # SQL Server 2025 (x64 emulation on ARM64 Macs)
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: mssql-ducklake-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_DUCKLAKE_PASS:-TestPassword1}
    ports:
      - "${MSSQL_DUCKLAKE_PORT:-7433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P ${MSSQL_DUCKLAKE_PASS:-TestPassword1} -C -Q 'SELECT 1' || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # one-shot init: creates the catalog database once the server is healthy (idempotent; CI applies
  # the same script to its service container with docker exec)
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: mssql-ducklake-sqlserver-init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./init:/init:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "mssql-ducklake: applying docker/init/sqlserver.sql ..."
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -i /init/sqlserver.sql
        echo "mssql-ducklake: init complete."
    environment:
      - MSSQL_SA_PASSWORD=${MSSQL_DUCKLAKE_PASS:-TestPassword1}

volumes:
  sqlserver-data:
    name: mssql-ducklake-sqlserver-data
